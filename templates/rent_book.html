<!DOCTYPE html>
<html>

<head>
    <title>Rent Book</title>
</head>

<body>
    <h2>Rent Book - Welcome, {{ user_name }}!</h2>
    <form method="POST" action="/rent">
        <label>Book ID:</label><input type="number" name="book_id" required><br><br>
        <input type="submit" value="Rent Book">
    </form>
    <h2>Return Book</h2>
    <form method="POST" action="/return">
        <label>Book ID:</label><input type="number" name="book_id" required><br><br>
        <input type="submit" value="Return Book">
    </form>
    <p><a href="/rentals">View your rentals</a></p>
    <p><a href="http://localhost:5001">Go to Books</a> | <a href="http://localhost:5505">Back to Dashboard</a></p>
</body>

</html>
